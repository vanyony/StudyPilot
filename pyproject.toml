[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studypilot"
version = "0.1.0"
description = "A time-constrained exam revision planner core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.30,<1",
  "openai>=1,<2",
  "mcp>=2,<3",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]
embeddings = [
  "sentence-transformers>=3.4,<6",
]
qq = [
  "qqbot-agent-sdk==1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/studypilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:anyio -p no:cacheprovider"
